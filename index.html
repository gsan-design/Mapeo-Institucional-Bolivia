<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapeo Institucional — Programas de apoyo a PYMES en Bolivia</title>
<meta name="theme-color" content="#ffffff">
<style>
:root {
  --bg:#ffffff;
  --ink:#111111;
  --muted:#555555;
  --line:#111111;
  --soft:#f6f6f6;
  --max:1220px;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;
  line-height:1.35;
}
button,input { font:inherit; color:inherit; }
button { -webkit-tap-highlight-color:transparent; }
.shell {
  width:min(var(--max), calc(100% - 44px));
  margin:0 auto;
  padding:42px 0 56px;
}
.home-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:32px;
  margin-bottom:44px;
}
.home-title h1 {
  margin:0;
  font-size:clamp(2.1rem,4vw,3.5rem);
  line-height:.95;
  letter-spacing:-.04em;
  font-weight:900;
  text-transform:uppercase;
}
.home-title p {
  margin:12px 0 0;
  font-size:clamp(1rem,1.9vw,1.55rem);
  line-height:1.05;
  font-weight:900;
  text-transform:uppercase;
}
.search {
  display:flex;
  align-items:center;
  width:min(320px, 100%);
  border:2.5px solid var(--line);
  border-radius:999px;
  min-height:54px;
  padding:0 18px;
  gap:12px;
  background:#fff;
}
.search .icon {
  font-size:1.55rem;
  line-height:1;
  transform:rotate(-12deg);
}
.search input {
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:1rem;
}
.grid-programas {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:28px;
}
.card-programa {
  border:3px solid var(--line);
  border-radius:18px;
  background:#fff;
  padding:30px 30px 28px;
  min-height:220px;
  text-align:left;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.card-programa:hover,
.card-programa:focus-visible {
  transform:translateY(-2px);
  background:var(--soft);
  outline:none;
}
.card-programa h2 {
  margin:0 0 24px;
  font-size:clamp(1.25rem,2vw,1.75rem);
  line-height:1.08;
  font-weight:900;
}
.label {
  display:block;
  margin-bottom:5px;
  font-weight:900;
  font-size:1.05rem;
}
.desc {
  margin:0;
  font-size:1rem;
  line-height:1.45;
}
.topnav {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
}
.back {
  border:2px solid var(--line);
  border-radius:999px;
  background:#fff;
  padding:8px 15px;
  font-weight:800;
  cursor:pointer;
}
.back:hover,.back:focus-visible { background:var(--soft); outline:none; }
.breadcrumb {
  color:var(--muted);
  font-size:.92rem;
  text-align:right;
}
.panel {
  border:3px solid var(--line);
  border-radius:18px;
  background:#fff;
  padding:clamp(28px,5vw,58px);
}
.panel-wide {
  width:min(980px,100%);
  margin:0 auto;
  min-height:620px;
}
.panel-narrow {
  width:min(650px,100%);
  margin:0;
  min-height:620px;
}
.program-title {
  margin:0 0 44px;
  font-size:clamp(1.45rem,2.5vw,2rem);
  line-height:1.08;
  font-weight:900;
}
.field {
  max-width:860px;
  margin:0 0 31px;
}
.field strong {
  display:block;
  margin-bottom:7px;
  font-size:1.15rem;
  font-weight:900;
}
.field p {
  margin:0;
  font-size:1.02rem;
  line-height:1.45;
}
.section-title {
  margin:48px 0 22px;
  font-size:1.25rem;
  font-weight:900;
}
.chips {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px 36px;
}
.chip-sector {
  border:2.5px solid var(--line);
  border-radius:999px;
  background:#fff;
  padding:12px 18px;
  min-height:52px;
  cursor:pointer;
  text-align:center;
  line-height:1.2;
}
.chip-sector:hover,.chip-sector:focus-visible { background:var(--soft); outline:none; }
.sector-pill {
  width:100%;
  border:2.5px solid var(--line);
  border-radius:999px;
  padding:10px 18px;
  margin-bottom:44px;
  font-size:1rem;
}
.problem-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px 46px;
}
.problem-btn {
  border:2.5px solid var(--line);
  border-radius:16px;
  background:#fff;
  min-height:96px;
  padding:18px 20px;
  cursor:pointer;
  text-align:center;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.03rem;
  line-height:1.28;
}
.problem-btn:hover,.problem-btn:focus-visible { background:var(--soft); outline:none; }
.problem-body {
  border:2.5px solid var(--line);
  border-radius:17px;
  padding:26px 24px 34px;
}
.problem-body p {
  margin:0;
  font-size:1.03rem;
  line-height:1.48;
}
.problem-block + .problem-block { margin-top:48px; }
.problem-block strong {
  font-size:1.12rem;
  font-weight:900;
}
.instrument-list {
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:21px;
}
.instrument {
  border:2.3px solid var(--line);
  border-radius:15px;
  background:#fff;
  min-height:86px;
  padding:14px 16px;
  cursor:pointer;
  text-align:center;
  max-width:280px;
  min-width:170px;
}
.instrument:hover,.instrument:focus-visible { background:var(--soft); outline:none; }
.instrument-detail {
  margin-top:18px;
  border-left:4px solid var(--line);
  padding:12px 15px;
  background:var(--soft);
  max-width:760px;
  display:none;
}
.empty {
  border:2px dashed #888;
  border-radius:14px;
  padding:18px;
  color:var(--muted);
}
.result-count {
  margin:0 0 20px;
  color:var(--muted);
  font-size:.9rem;
}
@media (max-width:860px) {
  .home-head { flex-direction:column; margin-bottom:30px; }
  .search { width:100%; }
  .grid-programas { grid-template-columns:1fr; gap:20px; }
  .card-programa { min-height:0; }
  .chips { grid-template-columns:1fr; gap:14px; }
  .problem-grid { grid-template-columns:1fr; gap:16px; }
  .panel { padding:28px 22px; }
  .program-title { margin-bottom:32px; }
  .panel-wide,.panel-narrow { min-height:0; }
}
</style>
</head>
<body>
<main class="shell" id="app"></main>

<script>
const PROGRAMAS = [{"nombre": "SAT (Servicio Asistencia Técnica)", "periodo": "1997-2005", "descripcion": "Programa estatal de capacitación y asistencia técnica para micro y pequeñas empresas manufactureras y turísticas. Funcionó mediante un sistema de bonos que otorgaba libertad de elección al productor", "objetivo": "Fortalecer capacidad artesanal", "categoria": "Asistencia técnica, incubación y fortalecimiento de capacidades", "categorias_sec": "", "sectores": [{"nombre": "Sector Industrial Manufacturero, Micro/Pequeña Industria y Artesanía (Sector Secundario)", "problemas": [{"texto": "Existían severas deficiencias en las habilidades gerenciales, administrativas, contables y de conocimiento de mercado en los empresarios industriales, microempresarios y artesanos", "hipotesis": "Si se otorgan bonos subsidiados de capacitación y asesoramiento gerencial (a través de los módulos Mejorar e Innovar), el microempresario elegirá libremente la oferta de formación en gestión, contabilidad e instrumentos administrativos que mejor se adapte a su negocio, adoptando competencias gerenciales directas que profesionalicen su unidad económica", "instrumentos": [{"nombre": "Programa \"Mejorar\"", "descripcion": "Operaba mediante bonos de capacitación otorgados a los microempresarios para cofinanciar cursos a elección en áreas de gestión empresarial, contabilidad y administración técnica de sus oficios"}]}, {"texto": "Las empresas manufactureras sufrían de baja eficiencia y falta de modernización en sus procesos productivos para adecuar la oferta a las exigencias del mercado interno y externo", "hipotesis": "Si se cofinancian diagnósticos evaluativos de producción e innovación técnica en planta (Programa Innovar) impartidos por expertos privados, la MyPE identificará sus cuellos de botella tecnológicos y aplicará mejoras operativas y de calidad que elevarán su eficiencia y rendimiento productivo", "instrumentos": [{"nombre": "Programa \"Innovar\"", "descripcion": "Ofrecía apoyo para la elaboración de diagnósticos evaluativos de producción en planta, la formulación de un plan de desarrollo empresarial y el acceso a bonos de asistencia técnica contratados con expertos en el negocio"}]}, {"texto": "Faltaba una oferta cualificada y transparente de servicios no financieros y consultoría técnica privada adaptada a las necesidades específicas de la micro y pequeña industria", "hipotesis": "Si el Estado asume una función de entidad de \"tercer piso\" (normando, acreditando e intermediando recursos mediante el registro de ICAPs y el Programa Fortalecer la Oferta) en lugar de prestar servicios directamente, se estimulará la oferta privada de consultores e institutos técnicos, garantizando un mercado transparente, diverso y sostenible de servicios empresariales", "instrumentos": [{"nombre": "Programa \"Fortalecer la Oferta\" y Registro de ICAPs", "descripcion": "Mecanismo institucional donde el SAT actuaba como entidad de \"tercer piso\", creando un padrón oficial para la acreditación y registro de Instituciones y Consultores de Capacitación (ICAPs) privados, dinamizando la oferta técnica del mercado"}]}, {"texto": "Las entidades públicas y privadas que prestaban servicios de desarrollo empresarial operaban con escasa eficiencia", "hipotesis": "Si se transfiere la administración operativa de los servicios a entidades e institutos privados bajo un mecanismo de subsidio a la demanda por bonos/vouchers, se eliminará la ineficiencia burocrática estatal y la oferta de capacitación se ajustará dinámicamente a los requerimientos reales del mercado", "instrumentos": [{"nombre": "Sistema de Bonos o Vouchers Subsidiados", "descripcion": "Mecanismo de financiamiento donde el Estado no prestaba el servicio directamente, sino que entregaba bonos al productor para subsidiar parcialmente la contratación de servicios privados, introduciendo competencia y libertad de elección ."}]}, {"texto": "Prevalecían barreras administrativas e impedimentos burocráticos que frenaban la creación de nuevas industrias y la modernización empresarial", "hipotesis": "Si se implementa la Cédula Empresarial (Programa Informar) como acreditación única e identificación simplificada, combinada con la desconcentración en Unidades Operativas Desconcentradas a nivel departamental, se reducirán los tiempos de procesamiento y costos administrativos de transacción para acceder a los beneficios del Estado", "instrumentos": [{"nombre": "Programa \"Informar\" y la Cédula Empresarial", "descripcion": "Acreditación e identificación simplificada que se otorgaba al microempresario para acceder ágilmente a los programas del SAT, complementado con la atención en Unidades Operativas Desconcentradas a nivel departamental"}]}, {"texto": "Existía un desempeño predominantemente individual entre los productores, lo que impedía la conformación de consorcios, cooperativas, subcontrataciones o esquemas de compras y ventas conjuntas", "hipotesis": "Si se otorgan bonos para diagnósticos y planes de desarrollo asociativo (Programa Asociar), las MyPEs tendrán incentivos económicos directos para conformar consorcios, cooperativas, redes de subcontratación y esquemas de compras/ventas conjuntas, logrando economías de escala y mayor poder de negociación", "instrumentos": [{"nombre": "Programa \"Asociar\":", "descripcion": "Financiaba la elaboración de diagnósticos y planes de desarrollo asociativo, otorgando bonos para apoyar compras/ventas conjuntas, creación de cooperativas, consorcios o redes de subcontratación ."}]}, {"texto": "Las MyPEs manufactureras enfrentaban barreras para comercializar sus bienes, desarrollar marcas, acceder a programas de promoción de exportaciones no tradicionales e integrarse en las cadenas productivas", "hipotesis": "Si se cofinancian estudios de comercialización, diseño de marcas y participación en ferias comerciales (Programa Mercados / Ampliar Mercados), los pequeños productores desarrollarán canales de venta efectivos, adaptarán sus productos a la demanda del consumidor y se integrarán en cadenas de distribución locales e internacionales", "instrumentos": [{"nombre": "Programa \"Mercados\" (o \"Ampliar Mercados\")", "descripcion": "Otorgaba bonos y asistencia técnica especializada para diagnósticos comerciales, diseño de marcas, posicionamiento de productos y participación de las MyPEs en ferias comerciales ."}]}, {"texto": "Dificultades de acceso e inclusión de mujeres y jóvenes en la iniciativa empresarial industrial y artesanal", "hipotesis": "Si se establece un esquema de acceso abierto para cualquier emprendedor mayor de 18 años acreditado y se cofinancia la capacitación en diversos oficios (confección, tejido, carpintería, metalmecánica), se logrará una inclusión masiva y equitativa de mujeres (superando el 60%) y jóvenes (alrededor del 20%) en la actividad productiva y en la generación de empleo", "instrumentos": [{"nombre": "Programa \"Emprender\" y Bonos de Capacitación Técnica en Oficios", "descripcion": "Esquema de bonos de formación accesible que financió masivamente cursos en talleres operados por privados en rubros como confección, tejido, carpintería y metalmecánica, registrando una alta participación de mujeres y jóvenes ."}]}]}]}, {"nombre": "Proyectos FOMIN / BID MyPEs", "periodo": "1999-2005", "descripcion": "Fondo internacional para canalizar financiamiento y apoyo integral a micro y pequeñas empresas formales, resolviendo la escasez de crédito productivo", "objetivo": "Apoyo integral MyPE", "categoria": "Financiamiento y crédito productivo", "categorias_sec": "", "sectores": [{"nombre": "Multisectorial", "problemas": [{"texto": "Las MyPEs formales enfrentaban un severo racionamiento del crédito en el sistema financiero tradicional por falta de garantías convencionales e historial bancario", "hipotesis": "Al canalizar recursos multilaterales hacia entidades financieras especializadas en microfinanzas, se introducen metodologías crediticias alternativas que evalúan capacidad de pago en lugar de exigir únicamente garantías convencionales.", "instrumentos": [{"nombre": "Convenio de Préstamo BID 1020/SF-BO", "descripcion": "Fondo multilateral asignado para intermediación financiera"}, {"nombre": "Ventanilla crediticia BDP/NAFIBO a EIFs", "descripcion": "Canalización de fondos a través de Instituciones Financieras de Desarrollo y banca de segundo piso"}]}, {"texto": "La oferta crediticia comercial se limitaba a plazos muy cortos e intereses elevados que impedían la inversión en activos fijos", "hipotesis": "Al disponer de subprogramas de crédito fomento con plazos extendidos, se otorga la liquidez necesaria para inversiones en maquinaria e infraestructura.", "instrumentos": [{"nombre": "Subprogramas de Crédito Productivo", "descripcion": "Líneas de financiamiento fomento con plazos de mediano y largo plazo"}]}, {"texto": "Los esfuerzos de financiamiento no estaban acompañados de servicios de asistencia técnica y desarrollo empresarial para garantizar la sostenibilidad y reconversión productiva", "hipotesis": "Al articular el financiamiento con servicios de apoyo empresarial, se fortalece la capacidad de repago y la reconversión productiva de la MyPE formal.", "instrumentos": [{"nombre": "Componente de Cooperación Técnica No Reembolsable", "descripcion": "Paquete de servicios de desarrollo empresarial acoplado a la concesión de préstamos"}]}]}]}, {"nombre": "SBPC y Acuerdos de Competitividad (ABC)", "periodo": "2001 - 2005", "descripcion": "Sistema de concertación público-privada creado para formular políticas de productividad, utilizando los ABC como compromisos mutuos de inversión y competitividad por cadena productiva", "objetivo": "Definir visión estratégica y generar cadenas competitivas", "categoria": "Articulación de cadenas, asociatividad e infraestructura productiva", "categorias_sec": "", "sectores": [{"nombre": "Sector Agropecuario y Agroindustrial", "problemas": [{"texto": "Conflictos y desarticulación público-privada: Falta de espacios institucionales de diálogo concertado y permanente entre empresarios, el gobierno y la academia", "hipotesis": "Al institucionalizar el Consejo Boliviano de Competitividad con espacios permanentes de concertación, se construyen agendas de trabajo compartidas restaurando la confianza mutua.", "instrumentos": [{"nombre": "Foro Boliviano de Productividad y Competitividad", "descripcion": "Espacio de diálogo al más alto nivel institucional"}]}]}, {"nombre": "Sector Industrial Manufacturero", "problemas": [{"texto": "Existía una profunda dispersión y desconexión geográfica y comercial entre los proveedores de materia prima en las regiones boscosas (Santa Cruz, Beni, Pando) y las industrias de transformación secundaria en las zonas de consumo (La Paz, Cochabamba, Altiplano), elevando el precio de la madera hasta en un 20% para los carpinteros", "hipotesis": "Si se institucionalizan mesas de concertación interdepartamentales de la cadena y convenios de abastecimiento preferencial bajo la Agenda de Responsabilidad Compartida (ARCO), se integrarán los eslabones primario y secundario, garantizando un flujo continuo y directo de madera aserrada legal y estandarizada a precios competitivos hacia las carpinterías locales", "instrumentos": [{"nombre": "Acuerdo Boliviano de Competitividad (ABC) y Agenda de Responsabilidad Compartida (ARCO) de la Cadena de Madera", "descripcion": "Convenios de abastecimiento preferencial y mesas de concertación público-privadas interdepartamentales que articularon directamente a las concesiones forestales, TCOs y aserraderos con los talleres de carpintería urbana para asegurar la provisión de madera legal"}]}, {"texto": "Más de 12.000 unidades productivas madereras operaban en la informalidad (solo el 10% de las micro y pequeñas empresas estaba legalmente registrada), lo que limitaba su capacidad de asociatividad, acceso a la banca y ventas corporativas o estatales", "hipotesis": "Si se implementan Acuerdos de Competitividad Municipales (ABCM) de simplificación de trámites y se ofrece el acceso al crédito, a las compras públicas (\"Compro Boliviano\") y al Programa de Maquicentros como incentivo condicionado a la formalización, las microempresas informales se asociarán en consorcios productivos de escala legalmente constituidos", "instrumentos": [{"nombre": "Acuerdos Bolivianos de Competitividad Municipales (ABCM) y Programa Nacional de Simplificación de Trámites", "descripcion": "Creación de ventanillas únicas municipales para el registro acelerado de empresas, condicionando el acceso a compras estatales (\"Compro Boliviano\") y programas técnicos a la formalización de los talleres"}]}, {"texto": "Las empresas madereras sufrían una severa restricción de liquidez debido a que la concesión forestal era inembargable por ley (impidiendo usar el bosque como garantía bancaria), y la banca privada exigía garantías colaterales tradicionales inaccesibles para las MyPEs", "hipotesis": "Si se canalizan mecanismos de financiamiento no convencionales (fondos fiduciarios BDP/NAFIBO, capital de riesgo y fondos de garantía sectoriales), los productores y carpinteros obtendrán el capital de operaciones necesario para financiar el acopio de materia prima y sus ciclos de producción sin depender de colaterales hipotecarios rígidos", "instrumentos": [{"nombre": "Fondos Fiduciarios de Financiamiento Productivo y Garantías No Convencionales (BDP / NAFIBO)", "descripcion": "Líneas de crédito de segundo piso y fondos fiduciarios respaldados por la CAF y el Estado que no exigían garantías colaterales hipotecarias rígidas sobre la tierra forestal"}]}, {"texto": "El transporte representaba hasta el 21% del precio final de la madera de exportación (y hasta el 41% en la fase de extracción inicial) debido al mal estado de la red caminera secundaria y de acceso al bosque, paralizando las actividades durante la época de lluvias", "hipotesis": "Si el Estado asume compromisos vinculantes en la matriz ARCO para la inversión prioritaria en la construcción, mejoramiento y mantenimiento continuo de carreteras troncales y caminos vecinales forestales, se reducirán significativamente los fletes de transporte, se estabilizará el abastecimiento de troncas y se evitará la carga financiera de mantener inventarios paralizados", "instrumentos": [{"nombre": "Matriz de Inversión Pública de la ARCO (Infraestructura y Logística)", "descripcion": "Compromisos presupuestarios vinculantes asumidos por el Estado para el mantenimiento y construcción prioritaria de carreteras troncales y accesos vecinales forestales (como el tramo Pailón-San José)"}]}, {"texto": "El equipamiento de la transformación primaria y secundaria registraba una obsolescencia superior a los 25 años, con precarias o inexistentes técnicas de secado y preservación de la madera, lo que generaba rendimientos bajos y productos propensos a deformaciones", "hipotesis": "Si se aplican incentivos tributarios (arancel e IVA cero para la importación de maquinaria industrial ) y se extiende la asistencia técnica a través del Centro de Servicios Industriales de la Cámara Forestal (CFB) y centros tecnológicos (CITEs/CETIPs), las unidades madereras modernizarán sus sierras, aumentarán el rendimiento por troza y resolverán el cuello de botella del secado", "instrumentos": [{"nombre": "Programa de Incentivos a la Incorporación Tecnológica (Arancel e IVA Cero) y CITE / CETIP Madera", "descripcion": "Exención arancelaria e impositiva diferida para la importación de maquinaria industrial, complementada con servicios de extensión técnica y hornos de secado en plantas piloto"}]}, {"texto": "Las empresas exportadoras del rubro sufrían severas iliquideces por las demoras administrativas (promedio de 116 días) en la devolución de los Certificados de Devolución Impositiva (CEDEIM) y por la rigidez en los permisos para usar insumos químicos controlados requeridos en el barnizado y acabado de muebles", "hipotesis": "Si se establece un mecanismo simplificado y expedito para la restitución oportuna del CEDEIM a exportadores directos e indirectos y se agiliza la regulación burocrática sobre sustancias controladas para acabados industriales, se restaurará el flujo de caja de las empresas exportadoras y se elevará la calidad de presentación de las manufacturas de exportación", "instrumentos": [{"nombre": "Mecanismo de Devolución Acelerada de CEDEIMs y Régimen Especial de Sustancias Controladas de la ARCO", "descripcion": "Procedimientos administrativos expeditos acordados en las matrices del ABC para reducir los tiempos de restitución del crédito fiscal exportador y simplificar los permisos de insumos químicos para acabado"}]}, {"texto": "El inadecuado cuidado zoosanitario en las propiedades ganaderas (marcas de fuego, parásitos) y las precarias condiciones de desuello en mataderos no regulados generaban severos cortes y marcas que depreciaban la piel cruda", "hipotesis": "Si se implementan baños de inmersión contra parásitos en fincas, se clausuran los mataderos clandestinos y se aplican normas de control sanitario y faeneo adecuado en frigoríficos, se garantizará la recolección de pieles sanas y sin defectos físicos, elevando el valor bruto de la materia prima para toda la cadena", "instrumentos": [{"nombre": "Programa de Control Zoosanitario y Regulaciones de Faeneo (SENASAG / Comités de Cadena)", "descripcion": "Normativas y baños de inmersión ganaderos dictados e implementados en frigoríficos regulados para eliminar las marcas de fuego y parásitos que dañaban la piel cruda ."}]}, {"texto": "Las curtiembres operaban con elevada capacidad ociosa debido a la escasez de cueros crudos y a la heterogeneidad en su conservación y grosor, viéndose obligadas a procesar lotes de baja calidad que encarecían el curtido", "hipotesis": "Si se conforma una Comisión Técnica para establecer una escala oficial de clasificación de cueros por peso y calidad e instalar el Centro Tecnológico del Cuero con un laboratorio de calibración y metrología acreditado, se estandarizará el suministro de cuero wet blue e industrializado, optimizando el rendimiento de procesamiento en planta", "instrumentos": [{"nombre": "Comisión Técnica de Clasificación de Cueros y Centro Tecnológico del Cuero (CITE / CETIP Cuero)", "descripcion": "Establecimiento de la tabla oficial de clasificación por peso/calidad e instalación de laboratorios acreditados de metrología y ensayos físicos para el tratamiento homogéneo del cuero wet blue"}]}, {"texto": "El eslabón de manufactura final estaba fragmentado en más de 100 pequeños talleres informales sin capacidad individual de escala, diseño técnico de calzado ni estandarización de procesos", "hipotesis": "Si se promueve la asociatividad en consorcios de exportación y la integración de los pequeños talleres en Maquicentros / Centros de Maquila apoyados por la Bolsa de Subcontratación, las microempresas elevarán su productividad, compartirán maquinaria de corte/costura y accederán conjuntamente a contratos corporativos e internacionales", "instrumentos": [{"nombre": "Programa de Maquicentros (Centros de Maquila), Bolsa de Subcontratación y Consorcios de Exportación", "descripcion": "Espacios físicos equipados con maquinaria compartida donde pequeños talleres informales se asociaban para maquilar en escala y abastecer pedidos industriales o de exportación"}]}, {"texto": "Las fábricas y talleres nacionales enfrentaban una severa reducción del mercado interno por la competencia desleal del calzado de contrabando y la masiva penetración de calzado sintético de bajo precio", "hipotesis": "Si el Estado ejecuta un control estricto en aduanas fronterizas y mercados locales contra el contrabando de calzado e insumos, sumado a la promoción de marcas colectivas y la campaña \"Consuma lo Nuestro\", se recuperará el mercado interno para el calzado nacional elaborado con cuero legítimo", "instrumentos": [{"nombre": "Estrategia de Protección del Mercado Interno y Campañas \"Consuma lo Nuestro / Compro Boliviano\"", "descripcion": "Refuerzo de controles fronterizos aduaneros e incentivos de preferencia comercial pública para el calzado manufacturado con cuero 100% nacional"}]}, {"texto": "Las empresas manufactureras y curtiembres sufrían problemas de liquidez debido a las elevadas tasas de interés bancarias, la falta de garantías colaterales tradicionales y la ausencia de líneas crediticias para financiar la preparación y envío de pedidos de exportación", "hipotesis": "Si se constituye un Fondo de Financiamiento y Garantías con recursos públicos para la industria del cuero, que disponga de créditos para pre y post embarque, capital de riesgo y la agilización de incentivos tributarios como el CEDEIM y el RITEX, se garantizará la liquidez operativa necesaria para cumplir con los ciclos de producción y comercialización internacional", "instrumentos": [{"nombre": "Fondo de Financiamiento y Garantías para la Cadena del Cuero y Régimen RITEX / CEDEIM", "descripcion": "Fondo público de garantías para créditos de pre/post embarque y agilización del Régimen de Internación Temporal para insumos de exportación"}]}, {"texto": "La drástica reducción de la superficie cultivada de algodón por el endeudamiento de los agricultores y los elevados costos de producción paralizó las desmotadoras y debilitó el suministro de fibra nacional para las hilanderías", "hipotesis": "Si se implementan programas de apoyo técnico e incentivos financieros dirigidos a la Asociación de Productores de Algodón (ADEPA), en articulación directa con las demandas de insumos de las hilanderías locales, se incrementará la superficie de siembra y el rendimiento por hectárea, asegurando el abastecimiento continuo de fibra de algodón de calidad a precios competitivos", "instrumentos": [{"nombre": "Convenio de Integración Agroindustrial de la Cadena Textil (ADEPA - Ministerio de Desarrollo Económico)", "descripcion": "Esquema de compras anticipadas y asistencia técnica en semillas para la Asociación de Productores de Algodón, vinculando su cosecha a la demanda directa de las hilanderías"}]}, {"texto": "Un grupo importante de plantas hilanderas operaba con tecnología antigua, sobredimensionamiento de capacidad instalada y un elevado endeudamiento bancario que comprometía su patrimonio e impedía la compra de materia prima", "hipotesis": "Si se aplican procesos de reestructuración patrimonial (mediante la Ley de Reestructuración de Empresas) combinados con incentivos de arancel e IVA cero para la importación de bienes de capital y acceso a capital de operaciones, se reactivarán las plantas hilanderas paralizadas, modernizando su parque tecnológico y reduciendo los costos unitarios de hiladura", "instrumentos": [{"nombre": "Ley de Reestructuración Patrimonial de Empresas e Incentivos de Arancel/IVA Cero a Bienes de Capital", "descripcion": "Mecanismo legal para la reprogramación de pasivos bancarios de plantas paralizadas, combinado con exención fiscal para la importación de nuevas máquinas de hilado ."}]}, {"texto": "El ingreso masivo de ropa usada y la entrada de confecciones de contrabando sin pago de aranceles mermaban la capacidad del mercado interno, desplazando las prendas de vestir elaboradas por la industria y los talleres nacionales", "hipotesis": "Si el Estado aplica un control aduanero estricto contra el contrabando de ropa usada e introduce reservas de mercado a través de las compras estatales (como uniformes y ropa militar vía \"Ferias a la Inversa\" y preferencias nacionales), se recuperará la demanda efectiva del mercado interno para las manufacturas textiles bolivianas", "instrumentos": [{"nombre": "Programa de Compras Estatales (\"Ferias a la Inversa\") y Decretos de Restricción Comercial", "descripcion": "Asignación reservada de licitaciones públicas (uniformes militares, escolares e institucionales) a la confección nacional, junto con controles sobre la ropa usada importada"}]}, {"texto": "Existía una profunda dificultad para que las industrias exportadoras (\"locomotoras\") subcontrataran a las micro y pequeñas empresas artesanales, debido a la informalidad, la falta de estandarización en la calidad de costura y los riesgos en los tiempos de entrega", "hipotesis": "Si se crean Maquicentros / Centros de Maquila y se fortalece la Bolsa de Subcontratación (respaldados con un Fondo Financiero para Encadenamientos Productivos), los pequeños talleres se asociarán y formalizarán en espacios físicos equipados, alcanzando los estándares de calidad e higiene industrial requeridos para integrarse eficientemente a las cadenas de exportación", "instrumentos": [{"nombre": "Bolsa de Subcontratación, CASUBS (Centros de Asesoramiento a la Subcontratación) y Fondo Financiero para Encadenamientos Productivos", "descripcion": "Red de centros de información e intermediación que conectaba a grandes industrias exportadoras (\"locomotoras\") con redes de microtalleres artesanales capacitados en Maquicentros"}]}]}, {"nombre": "Sector Servicios", "problemas": [{"texto": "Desconfianza entre eslabones de la cadena: Desarticulación entre los proveedores de materia prima, la industria procesadora y los comercializadores", "hipotesis": "Al suscribir Acuerdos Bolivianos de Competitividad (ABC) con compromisos recíprocos de inversión, cada actor asume responsabilidades puntuales que elevan la productividad total del cluster.", "instrumentos": [{"nombre": "Acuerdos Bolivianos de Competitividad (ABC)", "descripcion": "Documentos de compromiso público-privado"}]}]}]}, {"nombre": "PAC (Prog. Apoyo Competitividad)", "periodo": "2001 -2008", "descripcion": "Iniciativa de la CAF que financió investigación, asistencia técnica y articulación de cadenas o \"clusters\" de exportación mediante metodologías participativas y talleres", "objetivo": "Fortalecer clusters exportación", "categoria": "Articulación de cadenas, asociatividad e infraestructura productiva", "categorias_sec": "", "sectores": [{"nombre": "Sector Agropecuario y Agroindustrial", "problemas": [{"texto": "Baja competitividad sistémica y dependencia de primarios: Las formas de competir internacionalmente se basaban en ventajas comparativas estáticas (recursos naturales) en lugar de innovación y valor agregado", "hipotesis": "Al financiar diagnósticos estratégicos y de innovación, se orienta a los sectores productivos hacia la incorporación de mayor valor agregado en lugar de ventajas estáticas.", "instrumentos": [{"nombre": "Estudios de Caracterización y Análisis Competitivo", "descripcion": "Investigaciones técnicas de mercado por sector (Soya, Quinua, Vinos, Maderas, Cueros, Textiles)"}]}]}, {"nombre": "Sector Industrial Manufacturero", "problemas": [{"texto": "Existía una profunda dispersión y desconexión geográfica y comercial entre los proveedores de materia prima en las regiones boscosas (Santa Cruz, Beni, Pando) y las industrias de transformación secundaria en las zonas de consumo (La Paz, Cochabamba, Altiplano), elevando el precio de la madera hasta en un 20% para los carpinteros", "hipotesis": "Si se institucionalizan mesas de concertación interdepartamentales de la cadena y convenios de abastecimiento preferencial bajo la Agenda de Responsabilidad Compartida (ARCO), se integrarán los eslabones primario y secundario, garantizando un flujo continuo y directo de madera aserrada legal y estandarizada a precios competitivos hacia las carpinterías locales", "instrumentos": [{"nombre": "Acuerdo Boliviano de Competitividad (ABC) y Agenda de Responsabilidad Compartida (ARCO) de la Cadena de Madera", "descripcion": "Convenios de abastecimiento preferencial y mesas de concertación público-privadas interdepartamentales que articularon directamente a las concesiones forestales, TCOs y aserraderos con los talleres de carpintería urbana para asegurar la provisión de madera legal"}]}, {"texto": "Más de 12.000 unidades productivas madereras operaban en la informalidad (solo el 10% de las micro y pequeñas empresas estaba legalmente registrada), lo que limitaba su capacidad de asociatividad, n de cueros por peso y calidad e instalar el Centro Tecnológico del Cuero con un laboratorio de calibración y metrología acreditado, se estandarizará el suministro de cuero wet blue e industrializado, optimizando el rendimiento de procesamiento en planta", "instrumentos": [{"nombre": "Comisión Técnica de Clasificación de Cueros y Centro Tecnológico del Cuero (CITE / CETIP Cuero)", "descripcion": "Establecimiento de la tabla oficial de clasificación por peso/calidad e instalación de laboratorios acreditados de metrología y ensayos físicos para el tratamiento homogéneo del cuero wet blue"}]}, {"texto": "El eslabón de manufactura final estaba fragmentado en más de 100 pequeños talleres informales sin capacidad individual de escala, diseño técnico de calzado ni estandarización de procesos", "hipotesis": "Si se promueve la asociatividad en consorcios de exportación y la integración de los pequeños talleres en Maquicentros / Centros de Maquila apoyados por la Bolsa de Subcontratación, las microempresas elevarán su productividad, compartirán maquinaria de corte/costura y accederán conjuntamente a contratos corporativos e internacionales", "instrumentos": [{"nombre": "Programa de Maquicentros (Centros de Maquila), Bolsa de Subcontratación y Consorcios de Exportación", "descripcion": "Espacios físicos equipados con maquinaria compartida donde pequeños talleres informales se asociaban para maquilar en escala y abastecer pedidos industriales o de exportación"}]}, {"texto": "Las fábricas y talleres nacionales enfrentaban una severa reducción del mercado interno por la competencia desleal del calzado de contrabando y la masiva penetración de calzado sintético de bajo precio", "hipotesis": "Si el Estado ejecuta un control estricto en aduanas fronterizas y mercados locales contra el contrabando de calzado e insumos, sumado a la promoción de marcas colectivas y la campaña \"Consuma lo Nuestro\", se recuperará el mercado interno para el calzado nacional elaborado con cuero legítimo", "instrumentos": [{"nombre": "Estrategia de Protección del Mercado Interno y Campañas \"Consuma lo Nuestro / Compro Boliviano\"", "descripcion": "Refuerzo de controles fronterizos aduaneros e incentivos de preferencia comercial pública para el calzado manufacturado con cuero 100% nacional"}]}, {"texto": "Las empresas manufactureras y curtiembres sufrían problemas de liquidez debido a las elevadas tasas de interés bancarias, la falta de garantías colaterales tradicionales y la ausencia de líneas crediticias para financiar la preparación y envío de pedidos de exportación", "hipotesis": "Si se constituye un Fondo de Financiamiento y Garantías con recursos públicos para la industria del cuero, que disponga de créditos para pre y post embarque, capital de riesgo y la agilización de incentivos tributarios como el CEDEIM y el RITEX, se garantizará la liquidez operativa necesaria para cumplir con los ciclos de producción y comercialización internacional", "instrumentos": [{"nombre": "Fondo de Financiamiento y Garantías para la Cadena del Cuero y Régimen RITEX / CEDEIM", "descripcion": "Fondo público de garantías para créditos de pre/post embarque y agilización del Régimen de Internación Temporal para insumos de exportación"}]}, {"texto": "La drástica reducción de la superficie cultivada de algodón por el endeudamiento de los agricultores y los elevados costos de producción paralizó las desmotadoras y debilitó el suministro de fibra nacional para las hilanderías", "hipotesis": "Si se implementan programas de apoyo técnico e incentivos financieros dirigidos a la Asociación de Productores de Algodón (ADEPA), en articulación directa con las demandas de insumos de las hilanderías locales, se incrementará la superficie de siembra y el rendimiento por hectárea, asegurando el abastecimiento continuo de fibra de algodón de calidad a precios competitivos", "instrumentos": [{"nombre": "Convenio de Integración Agroindustrial de la Cadena Textil (ADEPA - Ministerio de Desarrollo Económico)", "descripcion": "Esquema de compras anticipadas y asistencia técnica en semillas para la Asociación de Productores de Algodón, vinculando su cosecha a la demanda directa de las hilanderías"}]}, {"texto": "Un grupo importante de plantas hilanderas operaba con tecnología antigua, sobredimensionamiento de capacidad instalada y un elevado endeudamiento bancario que comprometía su patrimonio e impedía la compra de materia prima", "hipotesis": "Si se aplican procesos de reestructuración patrimonial (mediante la Ley de Reestructuración de Empresas) combinados con incentivos de arancel e IVA cero para la importación de bienes de capital y acceso a capital de operaciones, se reactivarán las plantas hilanderas paralizadas, modernizando su parque tecnológico y reduciendo los costos unitarios de hiladura", "instrumentos": [{"nombre": "Ley de Reestructuración Patrimonial de Empresas e Incentivos de Arancel/IVA Cero a Bienes de Capital", "descripcion": "Mecanismo legal para la reprogramación de pasivos bancarios de plantas paralizadas, combinado con exención fiscal para la importación de nuevas máquinas de hilado ."}]}, {"texto": "El ingreso masivo de ropa usada y la entrada de confecciones de contrabando sin pago de aranceles mermaban la capacidad del mercado interno, desplazando las prendas de vestir elaboradas por la industria y los talleres nacionales", "hipotesis": "Si el Estado aplica un control aduanero estricto contra el contrabando de ropa usada e introduce reservas de mercado a través de las compras estatales (como uniformes y ropa militar vía \"Ferias a la Inversa\" y preferencias nacionales), se recuperará la demanda efectiva del mercado interno para las manufacturas textiles bolivianas", "instrumentos": [{"nombre": "Programa de Compras Estatales (\"Ferias a la Inversa\") y Decretos de Restricción Comercial", "descripcion": "Asignación reservada de licitaciones públicas (uniformes militares, escolares e institucionales) a la confección nacional, junto con controles sobre la ropa usada importada"}]}, {"texto": "Existía una profunda dificultad para que las industrias exportadoras (\"locomotoras\") subcontrataran a las micro y pequeñas empresas artesanales, debido a la informalidad, la falta de estandarización en la calidad de costura y los riesgos en los tiempos de entrega", "hipotesis": "Si se crean Maquicentros / Centros de Maquila y se fortalece la Bolsa de Subcontratación (respaldados con un Fondo Financiero para Encadenamientos Productivos), los pequeños talleres se asociarán y formalizarán en espacios físicos equipados, alcanzando los estándares de calidad e higiene industrial requeridos para integrarse eficientemente a las cadenas de exportación", "instrumentos": [{"nombre": "Bolsa de Subcontratación, CASUBS (Centros de Asesoramiento a la Subcontratación) y Fondo Financiero para Encadenamientos Productivos", "descripcion": "Red de centros de información e intermediación que conectaba a grandes industrias exportadoras (\"locomotoras\") con redes de microtalleres artesanales capacitados en Maquicentros"}]}]}, {"nombre": "Sector Servicios", "problemas": []}]}, {"nombre": "CITEs / CETIPs", "periodo": "2007 - Presente", "descripcion": "Centros públicos especializados de PRO-BOLIVIA que brindan asistencia técnica, capacitación, laboratorios y servicios de maquinado industrial para mejorar la productividad de las MyPEs", "objetivo": "Acceso a tecnología aplicada", "categoria": "Innovación tecnológica, digitalización y productividad", "categorias_sec": "", "sectores": [{"nombre": "Sector Industrial Manufacturero", "problemas": [{"texto": "Las micro y pequeñas empresas no cuentan con el capital individual para adquirir tecnología avanzada (como máquinas de corte/grabado láser, equipos de diseño digital 3D o automatización industrial)", "hipotesis": "Si el Estado implementa infraestructura tecnológica especializada (CETIPs/CITEs) que ponga a disposición servicios de maquinado de uso compartido e industrialización básica, las micro y pequeñas empresas podrán superar las barreras financieras de adquisición individual de equipos, optimizando sus líneas de producción e incrementando su productividad", "instrumentos": [{"nombre": "Servicios de Maquinado Industrial de Uso Compartido (Desarrollo Productivo)", "descripcion": "Infraestructura técnica y parque de maquinaria especializada administrada por PRO-BOLIVIA (en los CETIPs de El Alto, Cochabamba, Potosí y San Buenaventura), que presta servicios de procesamiento y maquinado a costos accesibles para que las MyPEs resuelvan puntos críticos de sus líneas de producción sin requerir la compra individual de equipos de alto costo"}]}, {"texto": "Inexistencia de laboratorios de control de calidad accesibles donde las MyPEs puedan realizar análisis físicos, químicos o microbiológicos indispensables para certificar sus productos y participar en compras estatales o mercados formales", "hipotesis": "Si los CETIPs operan laboratorios especializados para pruebas e investigaciones de calidad, las unidades productivas verificarán rigurosamente las características físicas y químicas de sus materias primas e insumos, acreditando los estándares técnicos exigidos para acceder a compras estatales y mercados formales", "instrumentos": [{"nombre": "Servicios de Laboratorio Especializado y Acreditación de Calidad CETIP", "descripcion": "Laboratorios técnicos instalados en los CETIPs para la realización de pruebas de control de calidad, ensayos físicos, químicos y microbiológicos. Permiten verificar y certificar las características de materias primas e insumos para que las MyPEs cumplan con las fichas técnicas exigidas en compras estatales y mercados formales"}]}, {"texto": "Escasa transferencia de conocimientos, prototipos e innovaciones aplicadas a los procesos de producción en planta", "hipotesis": "Si los CETIPs actúan como articuladores entre los sectores generadores de conocimiento (universidades e institutos técnicos), el sector público y el sector productivo, se orientará la investigación y desarrollo (I+I+D) a la resolución directa de los cuellos de botella técnicos en las plantas manufactureras", "instrumentos": [{"nombre": "Proyectos de Investigación, Innovación y Desarrollo (I+D+i) y Alianzas Academia-Industria", "descripcion": "Mecanismo de articulación institucional mediante convenios con universidades e institutos técnicos superiores para desarrollar tesis de grado, prácticas profesionales, prototipos e investigaciones aplicadas destinadas a resolver cuellos de botella técnicos específicos en las plantas manufactureras"}]}, {"texto": "Dificultad para homogeneizar lotes de producción, desarrollar prototipos de calidad y cumplir con fichas técnicas exigidas en el mercado", "hipotesis": "Si se prestan servicios de asistencia técnica especializada, capacitación y desarrollo de prototipos, los productores incorporarán software de diseño asistido por computadora (CAD/CAM, 3D) y patronaje digital, logrando homogeneizar sus lotes de producción y cumplir con fichas técnicas estandarizadas", "instrumentos": [{"nombre": "Servicios de Transferencia Tecnológica, Asistencia Técnica Especializada y Capacitación", "descripcion": "Programas de formación técnica y acompañamiento directo en planta para la adopción de herramientas informáticas de diseño asistido por computadora (CAD/CAM, 3D), optimización de patrones y estandarización de procesos productivos"}]}, {"texto": "Ineficiencia en el trazado manual, desaprovechamiento de tela, falta de precisión en el corte masivo y deficiencias en el acabado o tinte de telas y fibras", "hipotesis": "Si los CETIPs Textiles (El Alto y Potosí) brindan servicios de trazado, diseño y corte computarizado digital, los talleres confeccionistas reducirán el desperdicio de tela, optimizarán los tiempos de ensamblado y elevarán la calidad en la terminación de las prendas", "instrumentos": [{"nombre": "Servicios de Trazado, Patronaje y Corte Computarizado Digital (CETIP Textil El Alto y Potosí)", "descripcion": "Módulos equipados con software de diseño y mesas de corte automatizado que permiten digitalizar moldes, optimizar el acomodo del trazo y realizar el corte masivo de telas con alta precisión, minimizando el desperdicio de insumos textiles"}]}, {"texto": "Desperdicio de materia prima por aserrado impreciso, deficiencias en el secado de madera, maquinaria de corte obsoleta e inexistencia de diseño asistido por computadora", "hipotesis": "Si el CETIP Madera (El Alto y San Buenaventura) ofrece laboratorios de secado técnico y servicios de maquinado industrial de precisión, las carpinterías madereras aumentarán el rendimiento de corte por troza, evitarán deformaciones por humedad en el mueble e incrementarán el valor agregado de la madera", "instrumentos": [{"nombre": "Servicios de Maquinado de Precisión y Laboratorio de Secado Técnico (CETIP Madera El Alto y San Buenaventura)", "descripcion": "Instalaciones y hornos piloto para el secado controlado de madera y procesamiento de piezas en maquinaria de alta tecnología, garantizando la humedad óptima y el dimensionamiento exacto para evitar deformaciones en la carpintería fina y muebles"}]}, {"texto": "Curtido heterogéneo, falta de pruebas de laboratorio para medir resistencia/fricción de pieles, patronaje manual de calzado obsoleto y altos costos de corte", "hipotesis": "Si el CETIP Cuero (Cochabamba) facilita laboratorios de análisis físico-químico de pieles, diseño digital 3D y máquinas de corte/grabado láser, se asegurará la homogeneidad del curtido, se automatizará el patronaje y se reducirán sustancialmente los costos y tiempos de fabricación del calzado", "instrumentos": [{"nombre": "Laboratorio Físico-Químico del Cuero, Modelado Digital 3D y Corte Láser (CETIP Cuero Cochabamba)", "descripcion": "Servicios de ensayos físicos/químicos para estandarizar la formulación de curtiembre, escaneo 3D de hormas para diseño de calzado y máquinas de corte y grabado láser que automatizan el armado de piezas de marroquinería y calzado"}]}]}, {"nombre": "Sector Agroindustrial", "problemas": [{"texto": "Pérdida de valor agregado en materia prima lechera, problemas de inocuidad/vida útil del producto e insuficientes análisis sanitarios en pequeños emprendimientos lácteos", "hipotesis": "Si los centros tecnológicos implementan plantas piloto, investigación aplicada de alimentos y transferencia de Buenas Prácticas de Manufactura (BPM), se mejorará la eficiencia en la transformación de la materia prima, garantizando la inocuidad y extendiendo la vida útil de los productos procesados", "instrumentos": [{"nombre": "Plantas Piloto Agroindustriales, Ensayos de Alimentos y Acompañamiento en BPM (CETIP Lácteo)", "descripcion": "Infraestructura experimental y plantas piloto para el desarrollo e investigación de derivados lácteos y alimentos procesados, ensayos de laboratorio para extender la vida útil y transferencia de Buenas Prácticas de Manufactura (BPM) que aseguren la inocuidad"}]}]}]}, {"nombre": "PROLECHE (Fondo de Apoyo)", "periodo": "2011 - Presente", "descripcion": "Fondo que fomenta el complejo lácteo, promueve el consumo de leche y otorga transferencias e infraestructura a productores. Se financia con retenciones a bebidas alcohólicas.", "objetivo": "Fomentar complejo lácteo", "categoria": "Financiamiento y crédito productivo", "categorias_sec": "", "sectores": [{"nombre": "Complejo Productivo Lácteo", "problemas": [{"texto": "La población boliviana registraba índices de consumo de leche muy reducidos, afectando los niveles nutricionales de las familias y la seguridad alimentaria con soberanía", "hipotesis": "Si se captan recursos específicos provenientes de la Retención por Comercialización de Cerveza (RCC) y la Retención por Importación de Bebidas Alcohólicas (RIBA) para financiar campañas masivas de difusión comunicacional, ferias y eventos de incentivo nutricional, se concientizará a la población sobre los beneficios del alimento y se elevará de forma progresiva el consumo per cápita nacional", "instrumentos": [{"nombre": "Programa de Promoción del Consumo de Productos Lácteos y Campañas Comunicacionales", "descripcion": "Disposición de hasta el 4% de la recaudación anual del Fondo destinada al financiamiento de activaciones directas, ferias sectoriales, spots televisivos, cuñas radiales y material educativo para concientizar a la población (priorizando a niños, adultos mayores y gestantes) sobre el valor nutricional de la leche"}]}, {"texto": "Existían barreras económicas para que los sectores vulnerables o masivos de la población accedieran a productos lácteos básicos de consumo popular a un \"Precio Justo\"", "hipotesis": "Si el Ministerio de Desarrollo Productivo y Economía Plural otorga la Certificación de Precio Justo (CPJ) con el precio regulado impreso en el envase a las industrias que elaboren productos de consumo masivo o popular, se asegurará la oferta de lácteos esenciales a costos asequibles para las familias bolivianas", "instrumentos": [{"nombre": "Certificación de Precio Justo (CPJ) e Impresión del Precio en Envase", "descripcion": "Certificado oficial emitido por el Ministerio de Desarrollo Productivo y Economía Plural (MDPyEP) a las industrias que elaboran derivados de consumo popular, exigiendo la impresión obligatoria del precio regulado en el envase para garantizar su venta masiva a un costo accesible"}]}, {"texto": "Inseguridad e insuficiencia en la retribución económica que recibían los productores primarios por la leche fresca", "hipotesis": "Si el Fondo ejecuta transferencias directas a las industrias lácteas destinadas a cubrir y compensar el incremento en el precio de la leche fresca cruda pagado al lechero en función a bandas de precio establecidas, se protegerá la rentabilidad del pequeño productor primario frente a las variaciones en sus costos operativos", "instrumentos": [{"nombre": "Mecanismo de Transferencias Directas para Compensación de Precio Justo y Bandas de Precios", "descripcion": "Subvención monetaria canalizada hacia las industrias lácteas para cubrir y compensar el incremento en el precio de la leche fresca cruda pagado directamente al lechero en campo, en cumplimiento estricto de las Bandas de Precios fijadas periódicamente por el Estado"}]}, {"texto": "Limitaciones técnicas en el ordeño y acopio, manifestadas en la falta de tanques de enfriamiento, ordeñadoras mecánicas, tachos de aluminio e infraestructura para preservar la calidad e inocuidad de la leche cruda", "hipotesis": "Si se financian e implementan Iniciativas Productivas (IPs) para la transferencia de activos en especie —como tanques de enfriamiento, ordeñadoras mecánicas de doble bajada, tachos de aluminio e infraestructura de acopio—, se tecnificará el proceso de ordeño y se preservará la inocuidad y cadena de frío de la leche cruda desde el campo hasta la planta", "instrumentos": [{"nombre": "Iniciativas Productivas (IPs) Lácteas y Transferencia de Activos en Especie", "descripcion": "Fondo de transferencias públicas no reembolsables en especie dirigidas a asociaciones de pequeños productores para la dotación de tanques de enfriamiento de leche, ordeñadoras mecánicas de doble bajada, tachos de aluminio y construcción de centros de acopio"}]}, {"texto": "Dificultad de los pequeños productores lecheros (priorizados por la norma) para mantenerse en la actividad productiva frente a variaciones de costos y shocks climáticos", "hipotesis": "Si la regulación y la asignación de proyectos del Fondo aplican un criterio de priorización enfocado explícitamente en la escala de operaciones de los pequeños productores organizados en módulos o asociaciones, se consolidará la asociatividad y se generarán economías de escala que viabilicen su acopio e inclusión comercial", "instrumentos": [{"nombre": "Proyectos de Inversión con Criterio de Priorización por Escala de Operación", "descripcion": "Convocatorias y programas de inversión pública en las tres cuencas lecheras del país (Altiplano, Valles y Trópico), reglamentados para priorizar la asignación de recursos y financiamiento a los módulos y asociaciones de pequeña escala"}]}, {"texto": "Asimetrías en la escala de operaciones y necesidad de fortalecimiento técnico, financiero e industrial en las plantas procesadoras", "hipotesis": "Si en la distribución de incentivos y programas del Fondo se apoya preferentemente el desarrollo de las pequeñas y medianas plantas procesadoras que destinen su producción al mercado interno, se reducirán las disparidades del sector industrial y se promoverá una transformación láctea descentralizada", "instrumentos": [{"nombre": "Fondo de Fomento al Desarrollo del Complejo Lácteo y Asignación Preferencial PyMI", "descripcion": "Reserva presupuestaria (mínimo del 25% de la recaudación del Fondo) destinada a programas de fortalecimiento técnico, infraestructura y capacidad industrial para pequeñas y medianas empresas procesadoras que orientan su producción al mercado interno"}]}, {"texto": "Competencia generada por el uso e importación de leche en polvo importada en lugar del aprovechamiento de la leche fresca cruda de producción nacional", "hipotesis": "Si se establecen criterios cualitativos que otorguen mayor respaldo financiero a las industrias que procesen exclusivamente leche fresca cruda de origen nacional y no insumos importados, se garantizará la absorción total del acopio lechero local en el marco de la sustitución de importaciones", "instrumentos": [{"nombre": "Matriz de Criterios Cualitativos para la Asignación de Recursos", "descripcion": "Sistema de ponderación reglamentado en el DS 1207 y DS 4423 que premia a las empresas lácteas que procesan exclusivamente leche fresca cruda de origen nacional y penaliza o excluye del beneficio del Fondo a aquellas que utilizan leche en polvo importada como insumo industrial"}]}, {"texto": "Dificultad de algunas industrias y unidades productivas para cumplir de forma homogénea con las Normas Bolivianas de Calidad de productos lácteos", "hipotesis": "Si el acceso a las transferencias, proyectos y certificaciones del Fondo exige como requisito obligatorio el cumplimiento de las Normas Bolivianas de Calidad de productos lácteos, los actores del complejo estandarizarán sus procesos de producción primaria y transformación industrial", "instrumentos": [{"nombre": "Sistema de Registro y Acreditación Láctea, CETIP Lácteo u Observatorio Lácteo", "descripcion": "Registro obligatorio y verificación de campo realizada por PRO-BOLIVIA a las unidades productivas e industrias lácteas, condicionando el acceso a los beneficios del Fondo al cumplimiento estricto de las Normas Bolivianas de Calidad de la leche y habilitando laboratorios de ensayo e investigación tecnológica"}]}]}]}, {"nombre": "Fideicomisos Sectoriales y Multisectoriales (Incluye FDP, FIP y Líneas Sectoriales BDP)", "periodo": "2007 - Presente", "descripcion": "Patrimonios autónomos estatales operados por el BDP para canalizar financiamiento a sectores productivos estratégicos, promoviendo innovación tecnológica y sostenibilidad en micro y medianas unidades productivas", "objetivo": "Financiar las prioridades productivas y estratégicas del Estado", "categoria": "Financiamiento y crédito productivo", "categorias_sec": "", "sectores": [{"nombre": "Sector Agropecuario y Agroindustrial", "problemas": [{"texto": "Dificultad del pequeño productor rural para acceder a préstamos bancarios por falta de garantías colaterales tradicionales y descalce de plazos frente a los ciclos agrícolas y pecuarios", "hipotesis": "Si se constituyen fideicomisos estatales y productos crediticios que incorporen Garantías No Convencionales (derechos de cobro, contratos de venta a futuro, inventarios, avales comunitarios o semovientes) junto con periodos de gracia adaptados a los ciclos agrícolas, se logrará la inclusión financiera efectiva de pequeños productores campesinos e indígenas tradicionalmente excluidos de la banca comercial", "instrumentos": [{"nombre": "Sistema de Registro de Garantías No Convencionales y Fondo de Afianzamiento (FA-BDP)", "descripcion": "Mecanismo normativo e institucional que valida y registra colaterales alternativos (contratos de venta a futuro, cosechas, semovientes, avales comunitarios y maquinaria no sujeta a registro) y otorga cobertura de garantía crediticia para que pequeños productores urbanos y rurales accedan al financiamiento bancario sin depender de hipotecas tradicionales ."}]}, {"texto": "Pérdida de capital de trabajo en unidades productivas de alimentos ante eventos climáticos adversos o situaciones de emergencia declarada en cuencas productivas", "hipotesis": "Si el Estado crea fondos fiduciarios de emergencia dirigidos a zonas afectadas por eventos adversos (como los fideicomisos FIPOREBO, FIBECA o el FDP en situaciones de desastre), se otorgarán recursos oportunos para la reposición de activos, el repoblamiento ganadero y la compra de materia prima, evitando la quiebra y el abandono de la actividad productiva de alimentos .", "instrumentos": [{"nombre": "Fideicomisos de Reconstrucción y Emergencia Sectorial (FIPOREBO, FIBECA y FIREGAPO)", "descripcion": "Patrimonios autónomos activados mediante Decretos Supremos para canalizar préstamos de auxilio orientados a la reposición de activos, repoblamiento bovino, compra de materia prima de castaña y restitución de capacidad productiva avícola en municipios con declaratoria de desastre o emergencia sanitaria ."}]}, {"texto": "Escasa disponibilidad de insumos certificados (como semillas) y falta de recursos para financiar capital de inversión que permita modernizar la producción y mejorar rendimientos en campo .", "hipotesis": "Si los fideicomisos del BDP canalizan financiamiento de fomento de mediano y largo plazo destinado a capital de inversión, los productores adquirirán maquinaria, infraestructura de riego y semillas certificadas, incrementando los rendimientos por hectárea y la competitividad de los alimentos estratégicos .", "instrumentos": [{"no const app = document.getElementById("app");
const estado = { vista:"inicio", programa:null, sector:null, problema:null, q:"" };

function esc(v) {
  const d=document.createElement("div");
  d.textContent=v ?? "";
  return d.innerHTML;
}

function tituloProblema(texto, idx) {
  const t=(texto || "").trim();
  const c=t.indexOf(":");
  if (c>0 && c<100) return `Problema ${idx+1}. ${t.slice(0,c)}`;
  const p=t.match(/^(.{1,105}?)(?:[.!?](?:\s|$)|$)/);
  const short=(p && p[1] ? p[1] : t.slice(0,105)).trim();
  return `Problema ${idx+1}. ${short}${t.length>short.length ? "…" : ""}`;
}

function breadcrumb(parts) {
  return `<div class="breadcrumb">${parts.map(esc).join(" · ")}</div>`;
}

function push(vista, p=null, s=null, pr=null) {
  estado.vista=vista; estado.programa=p; estado.sector=s; estado.problema=pr;
  history.pushState({vista,p,s,pr}, "", location.pathname);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goBack() {
  if (estado.vista==="problema") return push("sector",estado.programa,estado.sector,null);
  if (estado.vista==="sector") return push("programa",estado.programa,null,null);
  if (estado.vista==="programa") return push("inicio",null,null,null);
  return push("inicio",null,null,null);
}

function renderInicio() {
  const q=estado.q.trim().toLowerCase();
  const filtrados=PROGRAMAS.map((p,i)=>({p,i})).filter(x => {
    if (!q) return true;
    const sectores=(x.p.sectores||[]).map(s=>s.nombre).join(" ");
    return `${x.p.nombre} ${x.p.periodo} ${x.p.descripcion} ${x.p.categoria} ${sectores}`.toLowerCase().includes(q);
  });
  app.innerHTML=`
    <section class="home-head">
      <div class="home-title">
        <h1>MAPEO INSTITUCIONAL</h1>
        <p>PROGRAMAS DE APOYO A PYMES EN BOLIVIA 1997 - 2026</p>
      </div>
      <label class="search" aria-label="Buscar programa">
        <span class="icon">⌕</span>
        <input id="buscar" type="search" placeholder="" value="${esc(estado.q)}">
      </label>
    </section>
    <p class="result-count">${filtrados.length} programa${filtrados.length===1?"":"s"}</p>
    <section class="grid-programas">
      ${filtrados.map(x=>`
        <button class="card-programa" data-programa="${x.i}">
          <h2>${esc(x.p.nombre)}${x.p.periodo ? ` (${esc(x.p.periodo)})` : ""}</h2>
          <span class="label">Descripción breve:</span>
          <p class="desc">${esc(x.p.descripcion || "Sin descripción registrada.")}</p>
        </button>
      `).join("")}
    </section>`;
  const buscar=document.getElementById("buscar");
  buscar.addEventListener("input", e=>{ estado.q=e.target.value; renderInicio(); document.getElementById("buscar").focus(); });
  app.querySelectorAll("[data-programa]").forEach(b=>b.addEventListener("click",()=>push("programa",+b.dataset.programa)));
}

function renderPrograma() {
  const p=PROGRAMAS[estado.programa];
  const sectores=p.sectores || [];
  app.innerHTML=`
    <div class="topnav">
      <button class="back" id="volver">← Volver</button>
      ${breadcrumb([p.nombre])}
    </div>
    <section class="panel panel-wide">
      <h2 class="program-title">${esc(p.nombre)}${p.periodo ? ` (${esc(p.periodo)})` : ""}</h2>
      <div class="field">
        <strong>Descripción breve:</strong>
        <p>${esc(p.descripcion || "Sin descripción registrada.")}</p>
      </div>
      <div class="field">
        <strong>Categoría principal de intervención:</strong>
        <p>${esc(p.categoria || "Sin categoría registrada.")}</p>
      </div>
      <div class="section-title">Problemas que buscaba resolver</div>
      <div class="chips">
        ${sectores.map((s,i)=>`<button class="chip-sector" data-sector="${i}">${esc(s.nombre)}</button>`).join("")}
      </div>
    </section>`;
  document.getElementById("volver").addEventListener("click",goBack);
  app.querySelectorAll("[data-sector]").forEach(b=>b.addEventListener("click",()=>push("sector",estado.programa,+b.dataset.sector)));
}

function renderSector() {
  const p=PROGRAMAS[estado.programa], s=p.sectores[estado.sector];
  const problemas=s.problemas || [];
  app.innerHTML=`
    <div class="topnav">
      <button class="back" id="volver">← Volver</button>
      ${breadcrumb([p.nombre,s.nombre])}
    </div>
    <section class="panel panel-wide">
      <h2 class="program-title">${esc(p.nombre)}${p.periodo ? ` (${esc(p.periodo)})` : ""}</h2>
      <div class="section-title" style="margin-top:0">Problemas que buscaba resolver</div>
      <div class="sector-pill">${esc(s.nombre)}</div>
      ${problemas.length ? `
        <div class="problem-grid">
          ${problemas.map((pr,i)=>`<button class="problem-btn" data-problema="${i}">${esc(tituloProblema(pr.texto,i))}</button>`).join("")}
        </div>` : `
        <div class="empty">Este sector figura en la base, pero todavía no tiene problemas detallados registrados.</div>`}
    </section>`;
  document.getElementById("volver").addEventListener("click",goBack);
  app.querySelectorAll("[data-problema]").forEach(b=>b.addEventListener("click",()=>push("problema",estado.programa,estado.sector,+b.dataset.problema)));
}

function renderProblema() {
  const p=PROGRAMAS[estado.programa], s=p.sectores[estado.sector], pr=s.problemas[estado.problema];
  const inst=pr.instrumentos || [];
  app.innerHTML=`
    <div class="topnav">
      <button class="back" id="volver">← Volver</button>
      ${breadcrumb([p.nombre,s.nombre,`Problema ${estado.problema+1}`])}
    </div>
    <section class="panel panel-narrow">
      <h2 class="program-title">${esc(p.nombre)}${p.periodo ? ` (${esc(p.periodo)})` : ""}</h2>
      <div class="problem-body">
        <div class="problem-block">
          <p><strong>Problema ${estado.problema+1}.</strong> ${esc(pr.texto)}</p>
        </div>
        <div class="problem-block">
          <p><strong>Hipótesis de solución:</strong> ${esc(pr.hipotesis || "No registrada en la base.")}</p>
        </div>
        <div class="problem-block">
          <strong>Instrumentos y herramientas:</strong>
          ${inst.length ? `
            <div class="instrument-list">
              ${inst.map((it,i)=>`<button class="instrument" data-inst="${i}">${esc(it.nombre || `Instrumento ${i+1}`)}</button>`).join("")}
            </div>
            <div class="instrument-detail" id="detalleInstrumento"></div>
          ` : `<div class="empty" style="margin-top:16px">No hay instrumentos registrados para este problema.</div>`}
        </div>
      </div>
    </section>`;
  document.getElementById("volver").addEventListener("click",goBack);
  const detalle=document.getElementById("detalleInstrumento");
  if (detalle) {
    app.querySelectorAll("[data-inst]").forEach(b=>b.addEventListener("click",()=>{
      const it=inst[+b.dataset.inst];
      detalle.innerHTML=`<strong>${esc(it.nombre)}</strong>${it.descripcion ? `<br>${esc(it.descripcion)}` : "<br>Sin descripción adicional registrada."}`;
      detalle.style.display="block";
    }));
  }
}

function render() {
  if (estado.vista==="programa") return renderPrograma();
  if (estado.vista==="sector") return renderSector();
  if (estado.vista==="problema") return renderProblema();
  renderInicio();
}

window.addEventListener("popstate",()=>{
  // El botón del navegador vuelve de forma segura al inicio si no hay estado histórico utilizable.
  estado.vista="inicio"; estado.programa=null; estado.sector=null; estado.problema=null;
  render();
});
render();
</script>
</body>
</html>
