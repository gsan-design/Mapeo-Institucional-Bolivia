<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas de programas — Mapeo v3</title>
<style>
  :root{
    --fondo:#ffffff; --tinta:#111111; --borde:#111111;
    --chip:#ffffff; --chip-hover:#f1f1f1; --tenue:#555555; --panel:#fafafa;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fondo:#141414; --tinta:#f2f2f2; --borde:#f2f2f2;
      --chip:#1c1c1c; --chip-hover:#2a2a2a; --tenue:#b5b5b5; --panel:#1a1a1a;
    }
  }
  :root[data-theme="dark"]{
    --fondo:#141414; --tinta:#f2f2f2; --borde:#f2f2f2;
    --chip:#1c1c1c; --chip-hover:#2a2a2a; --tenue:#b5b5b5; --panel:#1a1a1a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px; background:var(--fondo); color:var(--tinta);
    font-family:"Segoe UI",Calibri,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45;
  }
  .contenedor{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
  .ficha{
    border:3px solid var(--borde); border-radius:22px; padding:26px 28px 30px;
    background:var(--fondo);
  }
  .ficha h2{margin:0 0 18px; font-size:1.3rem; font-weight:700}
  .campo{margin-bottom:14px; max-width:70ch}
  .campo .etiqueta{font-weight:700; display:block}
  .campo .valor{font-weight:600}
  .seccion{font-weight:700; margin:22px 0 12px}
  .rejilla{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px}
  .chip{
    border:3px solid var(--borde); border-radius:14px; background:var(--chip);
    color:inherit; font:inherit; font-weight:700; text-align:left;
    padding:16px 18px; cursor:pointer; min-height:78px;
    display:flex; align-items:center; transition:background .15s;
  }
  .chip:hover,.chip:focus-visible{background:var(--chip-hover)}
  .detalle{border:3px solid var(--borde); border-radius:18px; padding:22px 24px; background:var(--panel)}
  .detalle .bloque{margin-bottom:22px; max-width:70ch}
  .detalle .bloque:last-child{margin-bottom:0}
  .instrumentos{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px}
  .chip-inst{
    border:2px solid var(--borde); border-radius:12px; background:var(--chip);
    color:inherit; font:inherit; font-weight:700; font-size:.9rem; text-align:left;
    padding:12px 14px; cursor:pointer; max-width:280px; transition:background .15s;
  }
  .chip-inst:hover{background:var(--chip-hover)}
  .desc-inst{
    margin-top:14px; padding:14px 16px; border-left:4px solid var(--borde);
    background:var(--fondo); font-size:.92rem; max-width:70ch;
  }
  .volver{
    margin-bottom:16px; border:2px solid var(--borde); border-radius:999px;
    background:transparent; color:inherit; font:inherit; font-weight:700;
    font-size:.85rem; padding:7px 16px; cursor:pointer;
  }
  .volver:hover{background:var(--chip-hover)}
  .oculto{display:none}
  @media print{ .chip{page-break-inside:avoid} }
</style>
</head>
<body>
<div class="contenedor" id="app"></div>

<script>
const PROGRAMAS = [
 {
  "nombre": "SAT (Servicio Asistencia Técnica)",
  "periodo": "1997-2005",
  "descripcion": "Programa estatal de capacitación y asistencia técnica para micro y pequeñas empresas manufactureras y turísticas. Funcionó mediante un sistema de bonos que otorgaba libertad de elección al productor",
  "categoria": "Asistencia técnica, incubación y fortalecimiento de capacidades",
  "categorias_sec": "",
  "problemas": [
   {
    "texto": "Gestión empresarial y habilidades gerenciales deficientes: Existían marcadas debilidades en la capacidad gerencial, contable, administrativa y de mercado en los micro y pequeños empresarios y artesanos",
    "hipotesis": "Al implementar un sistema de bonos subsidiados entregados directamente al microempresario, se le permite contratar capacitaciones en gestión y contabilidad a medida, adquiriendo competencias gerenciales directas",
    "instrumentos": [
     {
      "nombre": "Sistema de Bonos subsidiados",
      "descripcion": "Vouchers emitidos por el Estado para cofinanciar capacitaciones a demanda del productor"
     },
     {
      "nombre": "Registro de Instituciones de Capacitación (ICAPs)",
      "descripcion": "Padrón de consultores y centros privados acreditados"
     },
     {
      "nombre": "Programa \"Mejorar\"",
      "descripcion": "Módulo especializado en bonos para capacitación técnica en oficio y gestión"
     }
    ]
   },
   {
    "texto": "Trámites y burocracia estatal: El sector industrial enfrentaba impedimentos burocráticos y procesos lentos que frenaban la modernización y la iniciativa empresarial",
    "hipotesis": "Al desconcentrar operativamente los servicios e implementar un registro simplificado mediante Cédula Empresarial, se reducen los costos de transacción y tiempos administrativos para la modernización.",
    "instrumentos": [
     {
      "nombre": "Programa \"Informar\"",
      "descripcion": "Difusión institucional y ventanilla de atención al microempresario"
     },
     {
      "nombre": "Cédula Empresarial",
      "descripcion": "Acreditación única e identificación simplificada del beneficiario"
     },
     {
      "nombre": "Oficinas Regionales Desconcentradas",
      "descripcion": "Unidades territoriales operativas instaladas a nivel nacional"
     }
    ]
   },
   {
    "texto": "Inexistencia de un mercado de servicios no financieros: Carecía un mercado transparente y competitivo de consultoría privada y capacitación adaptado a las demandas reales de las micro y pequeñas empresas",
    "hipotesis": "Al actuar como entidad pública de \"tercer piso\" que acredita e intermedia recursos hacia consultores privados e institutos (ICAPs), se estimula la oferta privada y competitiva de servicios empresariales.",
    "instrumentos": [
     {
      "nombre": "Mecanismo Institucional de Tercer Piso",
      "descripcion": "Administración delegada donde el Estado norma y financia, mientras privados ejecutan"
     },
     {
      "nombre": "Programa \"Apoyo a la Oferta\"",
      "descripcion": "Bonos para la actualización y certificación de consultores privados"
     }
    ]
   },
   {
    "texto": "Improvisación y elevada mortalidad de negocios: Los emprendimientos nacían con visión de corto plazo y sin acompañamiento técnico, provocando la pérdida prematura de capital",
    "hipotesis": "Al estructurar módulos secuenciales (Emprender, Mejorar, Innovar, Asociar), se acompaña al emprendedor con diagnósticos y planes de desarrollo de largo plazo que evitan la quiebra prematura.",
    "instrumentos": [
     {
      "nombre": "Programa \"Emprender\"",
      "descripcion": "Bonos de financiamiento para tutores dedicados al diseño del plan empresarial"
     },
     {
      "nombre": "Programa \"Innovar\"",
      "descripcion": "Diagnóstico integral de producción, contabilidad y plan de desarrollo"
     },
     {
      "nombre": "Programas \"Asociar\" y \"Mercados\"",
      "descripcion": "Bonos para diagnósticos asociativos, consorcios y participación en ferias"
     }
    ]
   }
  ]
 }
];

const app = document.getElementById("app");

function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }

function render(){
  app.innerHTML = PROGRAMAS.map((p,i) => `
    <section class="ficha" id="ficha-${i}">
      <h2>${esc(p.nombre)}${p.periodo ? " (" + esc(p.periodo) + ")" : ""}</h2>
      <div id="cuerpo-${i}"></div>
    </section>`).join("");
  PROGRAMAS.forEach((_,i) => vistaResumen(i));
}

function vistaResumen(i){
  const p = PROGRAMAS[i];
  const cuerpo = document.getElementById("cuerpo-" + i);
  cuerpo.innerHTML = `
    ${p.descripcion ? `<div class="campo"><span class="etiqueta">Descripción breve:</span><span class="valor">${esc(p.descripcion)}</span></div>` : ""}
    ${p.categoria ? `<div class="campo"><span class="etiqueta">Categoría principal de intervención:</span><span class="valor">${esc(p.categoria)}</span></div>` : ""}
    <div class="seccion">Problemas que busca resolver</div>
    <div class="rejilla">
      ${p.problemas.map((pr,j) => `
        <button class="chip" data-prog="${i}" data-prob="${j}">
          Problema ${j+1}. ${esc(titulito(pr.texto))}
        </button>`).join("")}
    </div>`;
  cuerpo.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => vistaDetalle(i, +b.dataset.prob)));
}

function titulito(t){
  const corte = t.indexOf(":");
  return corte > 0 && corte < 90 ? t.slice(0, corte) : t;
}

function vistaDetalle(i, j){
  const p = PROGRAMAS[i], pr = p.problemas[j];
  const cuerpo = document.getElementById("cuerpo-" + i);
  cuerpo.innerHTML = `
    <button class="volver">← Volver</button>
    <div class="detalle">
      <div class="bloque"><strong>Problema ${j+1}.</strong> ${esc(pr.texto)}</div>
      ${pr.hipotesis ? `<div class="bloque"><strong>Hipótesis de solución:</strong> ${esc(pr.hipotesis)}</div>` : ""}
      <div class="bloque">
        <strong>Instrumentos y herramientas:</strong>
        <div class="instrumentos">
          ${pr.instrumentos.map((it,k) => `<button class="chip-inst" data-i="${k}">${esc(it.nombre)}</button>`).join("")}
        </div>
        <div class="desc-inst oculto" id="desc-inst"></div>
      </div>
    </div>`;
  cuerpo.querySelector(".volver").addEventListener("click", () => vistaResumen(i));
  const caja = cuerpo.querySelector("#desc-inst");
  cuerpo.querySelectorAll(".chip-inst").forEach(b => b.addEventListener("click", () => {
    const it = pr.instrumentos[+b.dataset.i];
    caja.innerHTML = `<strong>${esc(it.nombre)}.</strong> ${esc(it.descripcion || "Sin descripción registrada.")}`;
    caja.classList.remove("oculto");
  }));
  document.getElementById("ficha-" + i).scrollIntoView({behavior:"smooth", block:"start"});
}

render();
</script>
</body>
</html>
